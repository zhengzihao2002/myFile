<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="0.55" stop-color="#6a4cf0"/>
      <stop offset="1" stop-color="#3f2ab8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eaff"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ceff"/>
      <stop offset="1" stop-color="#aab1ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#4b3fd8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b1060" flood-opacity="0.28"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="0" y="0" width="300" height="220" rx="26"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824 px rounded square centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Folder back -->
  <path d="M232 352 a42 42 0 0 1 42 -42 h146 a40 40 0 0 1 30 13.5 l34 38.5 h276 a42 42 0 0 1 42 42 v334 a42 42 0 0 1 -42 42 H274 a42 42 0 0 1 -42 -42 Z" fill="url(#folderBack)"/>

  <!-- Photo card rising out of the folder -->
  <g transform="translate(372 278) rotate(-7 150 110)" filter="url(#soft)">
    <rect x="-14" y="-14" width="328" height="248" rx="36" fill="#ffffff"/>
    <g clip-path="url(#photoClip)">
      <rect width="300" height="220" fill="url(#sky)"/>
      <circle cx="214" cy="70" r="30" fill="#fff6d8"/>
      <path d="M-10 230 L92 112 L160 186 L204 140 L320 230 Z" fill="url(#hill)"/>
    </g>
  </g>

  <!-- Folder front -->
  <g filter="url(#soft)">
    <path d="M222 470 a40 40 0 0 1 40 -40 h500 a40 40 0 0 1 40 40 v254 a46 46 0 0 1 -46 46 H268 a46 46 0 0 1 -46 -46 Z" fill="url(#folder)"/>
  </g>
  <rect x="300" y="520" width="190" height="18" rx="9" fill="#6a4cf0" opacity="0.22"/>
  <rect x="300" y="560" width="130" height="18" rx="9" fill="#6a4cf0" opacity="0.14"/>

  <!-- Sync badge -->
  <g transform="translate(676 640)" filter="url(#soft)">
    <circle r="102" fill="url(#badge)"/>
    <circle r="102" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10"/>
    <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round">
      <path d="M-47.0 -17.1 A50 50 0 0 1 42.4 -26.5"/>
      <path d="M47.0 17.1 A50 50 0 0 1 -42.4 26.5"/>
    </g>
    <path d="M53.0 -9.5 L17.8 -20.6 L58.5 -46.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-53.0 9.5 L-17.8 20.6 L-58.5 46.0 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
