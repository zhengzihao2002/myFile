<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("myfile-index").textContent);
  var ROOT = DATA.tree;
  var tree = document.getElementById("tree");
  var q = document.getElementById("q");
  var sortBy = document.getElementById("sort");
  var MAX_MATCHES = 4000;
  var MEDIA = /\.(jpe?g|png|heic|heif|avif|tiff?|gif|webp|dng|cr2|cr3|nef|arw|raf|orf|rw2|mov|mp4|m4v|3gp|avi|mkv|mts)$/i;
  var TAKEN_KEYS = ["ExifIFD:DateTimeOriginal", "Keys:CreationDate", "UserData:DateTimeOriginal", "ExifIFD:CreateDate", "QuickTime:CreateDate", "IFD0:ModifyDate", "XMP-exif:DateTimeOriginal", "XMP-photoshop:DateCreated"];

  var parentOf = new Map();
  (function link(node, rel) {
    node.rel = rel;
    node.taken = takenOf(node);
    (node.k || []).forEach(function (child) {
      parentOf.set(child, node);
      link(child, rel ? rel + "/" + child.n : child.n);

  function takenOf(node) {

  document.title = DATA.name + " — folder index";
  document.getElementById("title").textContent = DATA.name;
  document.getElementById("root").textContent = DATA.root;
  var facts = [
    ["Folders", (stats.dirs || 0).toLocaleString()],
    ["Files", (stats.files || 0).toLocaleString()],
    ["Total size", humanSize(stats.size || 0)]

  facts.push(["Indexed", fmt(DATA.generatedAt)]);
  document.getElementById("facts").innerHTML = facts.map(function (f) {
    return '<div class="fact"><span class="k">' + esc(f[0]) + '</span><span class="v">' + esc(f[1]) + "</span></div>";
  }).join("");

    (stats.errorCount ? " · " + stats.errorCount.toLocaleString() + " item(s) could not be read" : "");

  var SVG = {
    twisty: '<svg class="twisty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',

      '<span class="c-date c-created">' + esc(fmt(node.c)) + "</span>" +
      '<span class="c-date c-mod">' + esc(fmt(node.m)) + "</span>" +

    if (self) budget.matches++;

    clone.k = kids;
    parentOf.set(clone, parentOf.get(node));

    }
    var target = rendered.get(node);
    if (!target) return;
    var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.row.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
    target.row.classList.remove("flash");
    void target.row.offsetWidth;
    target.row.classList.add("flash");
  }

  function buildStats(filesOnly) {
    var box = document.getElementById("stats");
    box.textContent = "";
    document.getElementById("scope-note").textContent = filesOnly
      ? "Files only. Click one to find it in the tree."
      : "Every folder and file, including " + DATA.name + " itself. Click one to find it.";
    var ex = findExtremes(filesOnly);
    [["Earliest created", ex.oc, "c"], ["Latest created", ex.nc, "c"], ["Earliest modified", ex.om, "m"], ["Latest modified", ex.nm, "m"]].forEach(function (spec) {
      var node = spec[1];
      if (!node) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "stat";
      btn.title = node.rel || DATA.name;
      btn.innerHTML = '<span class="k">' + spec[0] + '</span><span class="t">' + esc(fmt(node[spec[2]])) + '</span><span class="n">' + esc(node.rel || DATA.name + " (this folder)") + "</span>";
      btn.addEventListener("click", function () { reveal(node); });
      box.appendChild(btn);
    });
  }

  var timer;
  q.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 140); });
  sortBy.addEventListener("change", render);
  document.getElementById("collapse").addEventListener("click", function () { q.value = ""; render(); });
  document.getElementById("expand").addEventListener("click", function () {
    var total = countBelow(ROOT);
    if (total > 20000 && !confirm("This will draw " + total.toLocaleString() + " rows and may be slow. Continue?")) return;
    var term = q.value.trim().toLowerCase();
    var root = term ? filterTree(ROOT, term, { n: 0, matches: 0, capped: false }) : ROOT;
    if (!root) return;
    tree.textContent = "";
    rendered.clear();
    tree.appendChild(buildBranch(root, 0, term, true));
  });
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (o) { o.classList.toggle("on", o === btn); });
      buildStats(btn.dataset.scope === "files");
    });
  });
  buildStats(false);
  render();
})();
</script>
</body>
</html>
